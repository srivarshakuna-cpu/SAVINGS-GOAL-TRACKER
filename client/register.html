<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Savings Goal Tracker</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <header style="padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);">
    <a href="/" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none;">
      <div class="brand-logo" style="width: 36px; height: 36px;">₹</div>
      <div class="brand-text">Savings<span>Tracker</span></div>
    </a>
    <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme">
      <i class="theme-icon" data-lucide="moon"></i>
    </button>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
    <div class="card" style="width: 100%; max-width: 460px; box-shadow: var(--shadow-lg);">
      <div class="card-body" style="padding: 2rem;">
        <div style="text-align: center; margin-bottom: 1.75rem;">
          <h1 style="font-size: 1.625rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.35rem;">Start Saving Today</h1>
          <p style="font-size: 0.875rem; color: var(--text-muted);">Create your free account and turn goals into achievements</p>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
            <input type="text" class="form-input" id="reg-name" placeholder="Varsha Sharma" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
            <input type="email" class="form-input" id="reg-email" placeholder="name@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">Create Password <span class="required">*</span></label>
            <input type="password" class="form-input" id="reg-password" placeholder="At least 6 characters" minlength="6" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password <span class="required">*</span></label>
            <input type="password" class="form-input" id="reg-confirm-password" placeholder="Re-enter password" minlength="6" required>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="reg-submit-btn" style="margin-top: 0.5rem;">
            <span>Create Account</span>
          </button>
        </form>

        <div style="position: relative; text-align: center; margin: 1.5rem 0;">
          <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border-color);"></div>
          <span style="position: relative; background: var(--bg-surface); padding: 0 0.75rem; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Or</span>
        </div>

        <button type="button" class="btn btn-outline w-100" onclick="window.auth.loginWithGoogle()" style="display: flex; gap: 0.75rem; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Sign Up with Google</span>
        </button>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary);">
          Already have an account? <a href="/login" style="font-weight: 700;">Log in</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const confirmPass = document.getElementById('reg-confirm-password').value;
      const btn = document.getElementById('reg-submit-btn');

      if (password !== confirmPass) {
        showToast('Passwords do not match.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating account...';

      try {
        await window.auth.registerWithEmail(email, password, name);
        showToast('Account created successfully! Welcome aboard.', 'success');
        setTimeout(() => window.location.href = '/dashboard', 800);
      } catch (err) {
        showToast(err.message || 'Registration failed.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>Create Account</span>';
      }
    });
  </script>
</body>
</html>
