<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Savings Goal Tracker</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Simple Header -->
  <header style="padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);">
    <a href="/" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none;">
      <div class="brand-logo" style="width: 36px; height: 36px;">₹</div>
      <div class="brand-text">Savings<span>Tracker</span></div>
    </a>
    <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme">
      <i class="theme-icon" data-lucide="moon"></i>
    </button>
  </header>

  <!-- Login Container -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
    <div class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-lg);">
      <div class="card-body" style="padding: 2rem;">
        <div style="text-align: center; margin-bottom: 1.75rem;">
          <h1 style="font-size: 1.625rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.35rem;">Welcome Back</h1>
          <p style="font-size: 0.875rem; color: var(--text-muted);">Access your personal savings goals and dashboard</p>
        </div>

        <!-- Auth Method Selector Tabs -->
        <div style="display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem;">
          <button id="tab-btn-email" class="btn btn-ghost" style="flex: 1; border-radius: 0; border-bottom: 2px solid var(--primary); color: var(--primary); font-weight: 700;" onclick="switchAuthTab('email')">
            Email & Password
          </button>
          <button id="tab-btn-phone" class="btn btn-ghost" style="flex: 1; border-radius: 0; border-bottom: 2px solid transparent; color: var(--text-muted);" onclick="switchAuthTab('phone')">
            Phone / OTP
          </button>
        </div>

        <!-- 1. Email Form -->
        <form id="login-email-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address <span class="required">*</span></label>
            <input type="email" class="form-input" id="login-email" placeholder="name@example.com" value="demo@saver.in" required>
          </div>
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.375rem;">
              <label class="form-label" for="login-password" style="margin-bottom: 0;">Password <span class="required">*</span></label>
              <a href="/forgot-password" style="font-size: 0.8125rem;">Forgot password?</a>
            </div>
            <input type="password" class="form-input" id="login-password" placeholder="••••••••" value="demo123456" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="login-submit-btn" style="margin-top: 0.5rem;">
            <span>Log In</span>
          </button>
        </form>

        <!-- 2. Phone Form -->
        <form id="login-phone-form" style="display: none;">
          <div class="form-group" id="phone-input-group">
            <label class="form-label" for="login-phone">Phone Number (+91) <span class="required">*</span></label>
            <input type="tel" class="form-input" id="login-phone" placeholder="+91 98765 43210" required>
            <div class="form-hint">Enter your phone with country code. Demo OTP is 123456.</div>
            <button type="button" class="btn btn-outline w-100 mt-2" id="send-otp-btn" onclick="handleSendOtp()">
              <span>Send Verification Code</span>
            </button>
          </div>
          <div class="form-group" id="otp-input-group" style="display: none;">
            <label class="form-label" for="login-otp">Enter 6-Digit OTP <span class="required">*</span></label>
            <input type="text" class="form-input font-bold" id="login-otp" placeholder="123456" maxlength="6" style="letter-spacing: 0.25em; text-align: center; font-size: 1.25rem;">
            <button type="submit" class="btn btn-primary w-100 mt-2" id="verify-otp-btn">
              <span>Verify & Sign In</span>
            </button>
          </div>
        </form>

        <!-- Divider -->
        <div style="position: relative; text-align: center; margin: 1.75rem 0;">
          <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border-color);"></div>
          <span style="position: relative; background: var(--bg-surface); padding: 0 0.75rem; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Or continue with</span>
        </div>

        <!-- Google OAuth Button -->
        <button type="button" class="btn btn-outline w-100" onclick="window.auth.loginWithGoogle()" style="display: flex; gap: 0.75rem; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Sign In with Google</span>
        </button>

        <!-- 1-Click Evaluator Demo Quick Login -->
        <div style="margin-top: 1.5rem; padding: 1rem; background-color: var(--bg-subtle); border-radius: var(--radius-md); border: 1px dashed var(--border-color);">
          <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; text-align: center;">⚡ Instant Demo Evaluation</div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
            <button type="button" class="btn btn-secondary btn-sm" onclick="window.auth.loginDemo('admin')">
              Demo Admin 👑
            </button>
            <button type="button" class="btn btn-outline btn-sm" onclick="window.auth.loginDemo('user')">
              Demo User 👤
            </button>
          </div>
        </div>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary);">
          Don't have an account? <a href="/register" style="font-weight: 700;">Sign up free</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();

    // Tab switching
    function switchAuthTab(tab) {
      const emailBtn = document.getElementById('tab-btn-email');
      const phoneBtn = document.getElementById('tab-btn-phone');
      const emailForm = document.getElementById('login-email-form');
      const phoneForm = document.getElementById('login-phone-form');

      if (tab === 'email') {
        emailBtn.style.borderBottomColor = 'var(--primary)';
        emailBtn.style.color = 'var(--primary)';
        phoneBtn.style.borderBottomColor = 'transparent';
        phoneBtn.style.color = 'var(--text-muted)';
        emailForm.style.display = 'block';
        phoneForm.style.display = 'none';
      } else {
        phoneBtn.style.borderBottomColor = 'var(--primary)';
        phoneBtn.style.color = 'var(--primary)';
        emailBtn.style.borderBottomColor = 'transparent';
        emailBtn.style.color = 'var(--text-muted)';
        phoneForm.style.display = 'block';
        emailForm.style.display = 'none';
      }
    }

    // Email Login handler
    document.getElementById('login-email-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const btn = document.getElementById('login-submit-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        await window.auth.loginWithEmail(email, pass);
        showToast('Login successful! Welcome back.', 'success');
        setTimeout(() => window.location.href = '/dashboard', 600);
      } catch (err) {
        showToast(err.message || 'Login failed. Please check credentials.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>Log In</span>';
      }
    });

    // Phone OTP handlers
    async function handleSendOtp() {
      const phone = document.getElementById('login-phone').value;
      if (!phone) {
        showToast('Please enter a valid phone number.', 'warning');
        return;
      }
      const btn = document.getElementById('send-otp-btn');
      btn.disabled = true;
      btn.textContent = 'Sending OTP...';

      try {
        const res = await window.auth.sendPhoneOtp(phone);
        showToast(res.message || 'OTP sent! Please check your messages.', 'info');
        document.getElementById('phone-input-group').style.display = 'none';
        document.getElementById('otp-input-group').style.display = 'block';
      } catch (err) {
        showToast(err.message || 'Failed to send OTP.', 'error');
        btn.disabled = false;
        btn.textContent = 'Send Verification Code';
      }
    }

    document.getElementById('login-phone-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('login-phone').value;
      const otp = document.getElementById('login-otp').value;
      const btn = document.getElementById('verify-otp-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Verifying...';

      try {
        await window.auth.verifyPhoneOtp(phone, otp);
        showToast('Phone verified! Redirecting to dashboard...', 'success');
        setTimeout(() => window.location.href = '/dashboard', 600);
      } catch (err) {
        showToast(err.message || 'OTP verification failed.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>Verify & Sign In</span>';
      }
    });
  </script>
</body>
</html>
