<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions — Savings Goal Tracker</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar"></aside>

    <div class="app-main">
      <header class="app-header"></header>

      <main class="page-container">
        <!-- Header -->
        <div class="page-header">
          <div>
            <h1 class="page-title">Transaction History</h1>
            <p class="page-description">Detailed ledger of all savings deposits with filtering and CSV export.</p>
          </div>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <a href="/api/savings/export" class="btn btn-outline" download>
              <i data-lucide="download"></i> <span>Export to CSV</span>
            </a>
            <button class="btn btn-primary" onclick="openModal('quick-add-savings-modal')">
              <i data-lucide="plus-circle"></i> <span>Record New Savings</span>
            </button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="card mb-6">
          <div class="card-body" style="padding: 1.25rem;">
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 1rem; align-items: center;" id="tx-filter-grid">
              <!-- Search Note -->
              <div class="input-group">
                <span class="input-prefix"><i data-lucide="search" style="width: 16px; height: 16px;"></i></span>
                <input type="text" id="tx-search" class="form-input input-with-prefix" placeholder="Search by note, bonus, gig...">
              </div>

              <!-- Filter by Goal -->
              <select id="tx-goal-filter" class="form-select">
                <option value="">All Savings Goals</option>
              </select>

              <!-- Filter by Category -->
              <select id="tx-category-filter" class="form-select">
                <option value="">All Categories</option>
              </select>

              <!-- Sort Order -->
              <select id="tx-sort-order" class="form-select">
                <option value="desc">Newest First</option>
                <option value="asc">Oldest First</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Transactions Table Card -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Savings Ledger</h2>
            <div class="text-muted" style="font-size: 0.875rem;" id="tx-total-count">Showing 0 records</div>
          </div>
          <div class="table-container" style="border: none; border-radius: 0;">
            <table class="table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Target Goal</th>
                  <th>Category</th>
                  <th>Note / Memo</th>
                  <th style="text-align: right;">Amount</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="tx-ledger-tbody">
                <tr><td colspan="6" class="text-center" style="padding: 2.5rem;">Loading transactions...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Edit Transaction Modal -->
  <div class="modal-backdrop" id="edit-tx-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title">Edit Savings Entry</div>
        <button class="btn btn-ghost btn-sm" onclick="closeModal('edit-tx-modal')"><i data-lucide="x"></i></button>
      </div>
      <form id="edit-tx-form">
        <div class="modal-body">
          <input type="hidden" id="edit-tx-id">
          <input type="hidden" id="edit-tx-goal-id">

          <div class="form-group">
            <label class="form-label" for="edit-tx-amount">Amount (INR) <span class="required">*</span></label>
            <div class="input-group">
              <span class="input-prefix">₹</span>
              <input type="number" class="form-input input-with-prefix" id="edit-tx-amount" min="1" step="any" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-tx-date">Date <span class="required">*</span></label>
            <input type="date" class="form-input" id="edit-tx-date" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-tx-note">Note</label>
            <input type="text" class="form-input" id="edit-tx-note">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('edit-tx-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="edit-tx-submit-btn">Update Transaction</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let goalsList = [];
    let categoriesList = [];

    if (window.auth.requireAuth()) {
      renderAppShell('transactions');
      initTransactionsPage();
    }

    async function initTransactionsPage() {
      try {
        const [gRes, cRes] = await Promise.all([
          window.api.goals.list(),
          window.api.categories.list()
        ]);

        goalsList = gRes.data || [];
        categoriesList = cRes.data || [];

        // Populate dropdowns
        const goalSelect = document.getElementById('tx-goal-filter');
        goalSelect.innerHTML = '<option value="">All Savings Goals</option>' +
          goalsList.map(g => `<option value="${g.id}">${g.name}</option>`).join('');

        const catSelect = document.getElementById('tx-category-filter');
        catSelect.innerHTML = '<option value="">All Categories</option>' +
          categoriesList.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

        loadTransactions();

        // Listeners
        document.getElementById('tx-search').addEventListener('input', debounce(loadTransactions, 300));
        document.getElementById('tx-goal-filter').addEventListener('change', loadTransactions);
        document.getElementById('tx-category-filter').addEventListener('change', loadTransactions);
        document.getElementById('tx-sort-order').addEventListener('change', loadTransactions);
      } catch (err) {
        showToast('Failed to load transaction metadata: ' + err.message, 'error');
      }
    }

    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    async function loadTransactions() {
      const search = document.getElementById('tx-search').value;
      const goal_id = document.getElementById('tx-goal-filter').value;
      const category_id = document.getElementById('tx-category-filter').value;
      const sort = document.getElementById('tx-sort-order').value;

      try {
        const res = await window.api.savings.list({ search, goal_id, category_id, sort });
        if (!res.success) throw new Error(res.error);

        const txs = res.data || [];
        document.getElementById('tx-total-count').textContent = `Showing ${txs.length} record${txs.length === 1 ? '' : 's'}`;

        const tbody = document.getElementById('tx-ledger-tbody');
        if (txs.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="text-center" style="padding: 3rem;">
                <div class="empty-state" style="padding: 0;">
                  <div class="empty-state-icon"><i data-lucide="receipt"></i></div>
                  <div class="empty-state-title">No Transactions Found</div>
                  <div class="empty-state-desc">Try resetting your search filters or record a new savings deposit.</div>
                </div>
              </td>
            </tr>
          `;
          if (window.lucide) window.lucide.createIcons();
          return;
        }

        tbody.innerHTML = txs.map(t => `
          <tr>
            <td style="white-space: nowrap;">${formatDate(t.transaction_date)}</td>
            <td class="font-semibold" style="color: var(--text-primary);">${t.goal_name || t.goals?.name || 'General Goal'}</td>
            <td><span class="badge badge-info">${t.category_name || t.categories?.name || 'Savings'}</span></td>
            <td class="text-secondary" style="max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${t.note || '—'}</td>
            <td style="text-align: right; font-weight: 700; color: var(--primary);">+${formatCurrency(t.amount)}</td>
            <td style="text-align: right; white-space: nowrap;">
              <button class="btn btn-ghost btn-sm" onclick="openEditTx('${t.id}', '${t.goal_id}', ${t.amount}, '${t.transaction_date}', '${(t.note || '').replace(/'/g, "\\'")}')" title="Edit">
                <i data-lucide="pencil" style="width: 14px; height: 14px;"></i>
              </button>
              <button class="btn btn-ghost btn-sm" onclick="deleteTx('${t.id}')" title="Delete" style="color: var(--error);">
                <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
              </button>
            </td>
          </tr>
        `).join('');

        if (window.lucide) window.lucide.createIcons();
      } catch (err) {
        showToast('Error loading ledger: ' + err.message, 'error');
      }
    }

    function openEditTx(id, goalId, amount, date, note) {
      document.getElementById('edit-tx-id').value = id;
      document.getElementById('edit-tx-goal-id').value = goalId;
      document.getElementById('edit-tx-amount').value = amount;
      document.getElementById('edit-tx-date').value = date;
      document.getElementById('edit-tx-note').value = note;
      openModal('edit-tx-modal');
    }

    document.getElementById('edit-tx-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-tx-id').value;
      const goal_id = document.getElementById('edit-tx-goal-id').value;
      const amount = Number(document.getElementById('edit-tx-amount').value);
      const transaction_date = document.getElementById('edit-tx-date').value;
      const note = document.getElementById('edit-tx-note').value;
      const btn = document.getElementById('edit-tx-submit-btn');

      btn.disabled = true;
      try {
        await window.api.savings.update(id, { goal_id, amount, transaction_date, note });
        closeModal('edit-tx-modal');
        showToast('Transaction updated successfully!', 'success');
        loadTransactions();
      } catch (err) {
        showToast(err.message || 'Update failed', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    async function deleteTx(id) {
      if (confirm('Are you sure you want to delete this savings deposit?')) {
        try {
          await window.api.savings.delete(id);
          showToast('Transaction deleted.', 'info');
          loadTransactions();
        } catch (err) {
          showToast(err.message || 'Delete failed', 'error');
        }
      }
    }

    window.onSavingsAdded = () => {
      loadTransactions();
    };
  </script>
</body>
</html>
