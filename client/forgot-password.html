<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Savings Goal Tracker</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <header style="padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);">
    <a href="/" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none;">
      <div class="brand-logo" style="width: 36px; height: 36px;">₹</div>
      <div class="brand-text">Savings<span>Tracker</span></div>
    </a>
    <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme">
      <i class="theme-icon" data-lucide="moon"></i>
    </button>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
    <div class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-lg);">
      <div class="card-body" style="padding: 2rem;">
        <div style="text-align: center; margin-bottom: 1.75rem;">
          <div style="width: 52px; height: 52px; border-radius: var(--radius-full); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
            <i data-lucide="key-round" style="width: 24px; height: 24px;"></i>
          </div>
          <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.35rem;">Forgot Password?</h1>
          <p style="font-size: 0.875rem; color: var(--text-muted);">Enter your registered email and we'll send you recovery instructions.</p>
        </div>

        <form id="forgot-form">
          <div class="form-group">
            <label class="form-label" for="reset-email">Email Address <span class="required">*</span></label>
            <input type="email" class="form-input" id="reset-email" placeholder="name@example.com" required>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="reset-submit-btn" style="margin-top: 0.5rem;">
            <span>Send Reset Instructions</span>
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary);">
          Remember your password? <a href="/login" style="font-weight: 700;">Back to login</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      const btn = document.getElementById('reset-submit-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Sending link...';

      try {
        await window.auth.requestPasswordReset(email);
        showToast('Password recovery instructions sent to your email!', 'success');
        setTimeout(() => window.location.href = '/login', 2500);
      } catch (err) {
        showToast(err.message || 'Failed to send reset instructions.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>Send Reset Instructions</span>';
      }
    });
  </script>
</body>
</html>
